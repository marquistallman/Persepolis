<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - PersepolisAI</title>
    <link rel="stylesheet" href="../css/main.css">
</head>
<body class="bg-background text-text-primary flex flex-col min-h-screen">
    <header class="sticky top-0 z-50 bg-background-light/95 backdrop-blur-sm border-b border-border shadow-subtle">
        <nav class="container mx-auto px-4 py-4 flex items-center justify-between">
            <a href="homepage.html" class="font-headline text-2xl font-bold text-primary">PersepolisAI</a>
            <div class="hidden md:flex items-center gap-8">
                <a href="homepage.html" class="text-text-secondary hover:text-accent transition-colors">Home</a>
                <a href="browse.html" class="text-text-secondary hover:text-accent transition-colors">Browse</a>
            </div>
        </nav>
    </header>

    <main class="flex-1 container mx-auto px-4 py-12">
        <div class="max-w-2xl mx-auto">
            <h1 class="font-headline text-4xl font-bold mb-2 text-center">Get in Touch</h1>
            <p class="text-text-secondary text-center mb-10">Have questions or suggestions? We'd love to hear from you.</p>

            <div class="card p-8">
                <form class="space-y-6">
                    <div class="grid md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium mb-2">First Name</label>
                            <input type="text" id="firstName" class="w-full px-4 py-3 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:outline-none bg-background-light">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">Last Name</label>
                            <input type="text" id="lastName" class="w-full px-4 py-3 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:outline-none bg-background-light">
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium mb-2">Email Address</label>
                        <input type="email" id="email" class="w-full px-4 py-3 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:outline-none bg-background-light">
                    </div>

                    <div>
                        <label class="block text-sm font-medium mb-2">Subject</label>
                        <select id="subject" class="w-full px-4 py-3 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:outline-none bg-background-light">
                            <option>General Inquiry</option>
                            <option>Support</option>
                            <option>Copyright Issue</option>
                            <option>Partnership</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium mb-2">Message</label>
                        <textarea id="message" rows="5" class="w-full px-4 py-3 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:outline-none bg-background-light"></textarea>
                    </div>

                    <button type="button" id="submitBtn" class="w-full btn-primary py-3 text-lg">Send Message</button>
                </form>
            </div>

            <div class="mt-12 grid md:grid-cols-3 gap-6 text-center">
                <div class="p-4">
                    <div class="w-12 h-12 bg-accent/10 rounded-full flex items-center justify-center mx-auto mb-3 text-accent">📧</div>
                    <h3 class="font-semibold">Email</h3>
                    <p class="text-sm text-text-secondary">support@persepolis.ai</p>
                </div>
                <div class="p-4">
                    <div class="w-12 h-12 bg-accent/10 rounded-full flex items-center justify-center mx-auto mb-3 text-accent">📍</div>
                    <h3 class="font-semibold">Office</h3>
                    <p class="text-sm text-text-secondary">Bogotá, Colombia</p>
                </div>
                <div class="p-4">
                    <div class="w-12 h-12 bg-accent/10 rounded-full flex items-center justify-center mx-auto mb-3 text-accent">📱</div>
                    <h3 class="font-semibold">Social</h3>
                    <p class="text-sm text-text-secondary">@PersepolisAI</p>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-primary-900 text-white py-8 mt-auto">
        <div class="container mx-auto px-4 text-center"><p class="text-white/70">© 2025 PersepolisAI.</p></div>
    </footer>
<script id="dhws-dataInjector" src="../public/dhws-data-injector.js"></script>
<script>
    document.getElementById('submitBtn').addEventListener('click', async function() {
        const btn = this;
        const originalText = btn.innerText;
        btn.innerText = 'Sending...';
        btn.disabled = true;

        const data = {
            firstName: document.getElementById('firstName').value,
            lastName: document.getElementById('lastName').value,
            email: document.getElementById('email').value,
            subject: document.getElementById('subject').value,
            message: document.getElementById('message').value
        };

        try {
            const response = await fetch('/api/contact', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            
            if (response.ok) {
                alert('Message sent successfully! We will get back to you soon.');
                document.querySelector('form').reset();
            } else {
                alert('Failed to send message. Please try again.');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('An error occurred. Please check your connection.');
        } finally {
            btn.innerText = originalText;
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
